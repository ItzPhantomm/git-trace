[project]
name = "git-crime-scene"
version = "0.1.0"
description = "Interactive Git repository forensics in your terminal"
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "textual==0.76.0"]

[project.scripts]
crime-scene = "crime_scene.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crime_scene"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
