[project]
name = "git-trace"
version = "0.1.0"
description = "Trace Git history — local repos and GitHub URLs — in a premium terminal dashboard"
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "textual==0.76.0"]

[project.scripts]
git-trace = "git_trace.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_trace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]